server {
    listen 80;
    root /usr/share/nginx/html;

    # API проксируется на тот же origin, поэтому CORS на бэкенде не нужен.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Без этого браузер покажет собственное окно Basic Auth на каждый 401.
        proxy_hide_header WWW-Authenticate;
    }

    # SPA: неизвестные пути отдают index.html, маршрутизирует vue-router.
    location / {
        try_files $uri /index.html;
    }
}
