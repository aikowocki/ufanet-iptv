# Изолированный стенд для нагрузочных замеров: task load:up / task load:down.
# Отдельный проект (iptv-load), свои порты и БД без тома, поэтому рабочий стек не затрагивается.
# Лимиты CPU и памяти фиксированы, чтобы замеры сравнивались между прогонами.
# pprof публикуется только на loopback хоста и без авторизации: не выставляйте его наружу.
name: iptv-load
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: iptv
      POSTGRES_DB: iptv
    # pg_stat_statements показывает, какие запросы дороже всего (см. bench/profile.sh).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv -d iptv"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: server
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      LOG_LEVEL: warn
      DATABASE_URL: postgres://iptv:iptv@postgres:5432/iptv?sslmode=disable
      STREAM_BASE_URL: http://127.0.0.1:18081
      PPROF_ADDR: 0.0.0.0:6060
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:6060:6060"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
  stream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: stream
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g
    environment:
      APP_ENV: dev
      STREAM_HTTP_ADDR: ":8081"
      LOG_LEVEL: warn
      DATABASE_URL: postgres://iptv:iptv@postgres:5432/iptv?sslmode=disable
      STREAM_PPROF_ADDR: 0.0.0.0:6061
    ports:
      - "127.0.0.1:18081:8081"
      - "127.0.0.1:6061:6061"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/live/x.m3u8 2>&1 | grep -q 403"]
      interval: 2s
      timeout: 3s
      retries: 15
